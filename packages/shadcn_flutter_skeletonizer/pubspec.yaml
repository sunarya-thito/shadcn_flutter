name: shadcn_flutter_skeletonizer
description: "Skeleton loading effects for shadcn_flutter: skeletonizer wired into the shadcn theme, with asSkeleton() and friends."
version: 0.0.55
homepage: "https://github.com/sunarya-thito/shadcn_flutter"
documentation: "https://sunarya-thito.github.io/shadcn_flutter/"
repository: "https://github.com/sunarya-thito/shadcn_flutter"
issue_tracker: "https://github.com/sunarya-thito/shadcn_flutter/issues"

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  skeletonizer: ^3.0.0
  shadcn_flutter: '>=0.0.55 <0.1.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # skeletonizer draws Material icons in its placeholder widgets.
  uses-material-design: true

topics:
- widgets
- user-interface
- loading
- skeleton
- shadcn-ui
